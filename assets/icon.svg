      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#0b0a10"/>
    </linearGradient>
    <linearGradient id="letras" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
