<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <title>Registro de vendedor · S.A.E.N</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="S.A.E.N">
  <script type="module" src="js/common/pwa.js"></script>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="center-screen">
    <div class="card narrow">
      <a href="index.html" style="display:inline-block"><img src="assets/icon.svg" alt="S.A.E.N" width="64" height="64"></a>
      <h1 style="margin-top:10px">Registro de vendedor</h1>
      <p class="muted small">Tu cuenta quedará pendiente hasta que un administrador la apruebe.</p>

      <form id="form-registro" novalidate>
        <div class="field">
          <label for="nombre">Nombre y apellido</label>
          <input id="nombre" autocomplete="name" minlength="3" maxlength="80" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña (mínimo 8 caracteres)</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-registro">Enviar solicitud</button>
      </form>

      <div id="listo" class="alert alert-ok hidden">
        <strong>Solicitud enviada.</strong> Te avisaremos cuando el administrador apruebe tu cuenta.
        Después podés <a href="login.html">iniciar sesión</a>.
      </div>

      <p class="small" style="margin-top:16px"><a href="login.html">Ya tengo cuenta</a></p>
    </div>
  </main>
  <script type="module" src="js/auth/registro.js"></script>
</body>
</html>
