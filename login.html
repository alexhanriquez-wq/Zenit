<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <title>Iniciar sesión · Zenit</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="center-screen">
    <div class="card narrow">
      <a class="brand" href="index.html">ZENIT</a>
      <h1 style="margin-top:10px">Iniciar sesión</h1>

      <div id="aviso" class="alert alert-warn hidden" style="margin-bottom:14px"></div>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-login">Entrar</button>
      </form>

      <div id="pendiente" class="hidden stack">
        <button class="btn btn-block" id="btn-salir">Cerrar sesión</button>
      </div>

      <div class="row" style="justify-content:space-between;margin-top:16px">
        <a href="#" id="link-reset" class="small">Olvidé mi contraseña</a>
        <a href="registro.html" class="small">Registrarme como vendedor</a>
      </div>
    </div>
  </main>
  <script type="module" src="js/auth/login.js"></script>
</body>
</html>
